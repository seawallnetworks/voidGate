# voidGate's system group (see sysusers.d(5)). make install copies this
# file to /etc/sysusers.d/; systemd-sysusers creates the group now and,
# on a machine made from a staged install, at its first boot.
#
# voidgate: the shipped voidgate.service runs voidgate -g voidgate, so the
# control socket is 0660 root:voidgate. Members get the whole protocol,
# disarm and reload included: sw_configd's unit adds it, and a gateway's
# worker user joins it to use lua/resty/voidgate.lua.
g voidgate -
